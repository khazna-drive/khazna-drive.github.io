<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خزنة — لوحة المدير</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0f766e">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f7f8;--card:#fff;--text:#0f1f1e;--muted:#5f6f6e;--line:#e3e9e9;--accent:#0f766e;--accent-soft:#d9f2ee;--danger:#dc2626;--warn:#d97706;--shadow:0 6px 24px rgba(15,31,30,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0b1514;--card:#132221;--text:#eef5f4;--muted:#9db3b1;--line:#1f3331;--accent:#2dd4bf;--accent-soft:#12302d;--shadow:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}.hdr h1{font-size:22px;margin:0;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.stat b{display:block;font-size:26px;color:var(--accent)}.stat span{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.btn{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
.btn.light{background:var(--accent-soft);color:var(--accent)}.btn.danger{background:#fee2e2;color:var(--danger)}.btn.warn{background:#fef3c7;color:var(--warn)}.btn.sm{padding:5px 10px;font-size:13px}
input,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.user{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.user:last-child{border:0}
.av{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:800}
.av img{width:100%;height:100%;object-fit:cover}
.user .info b{display:block}.user .info small{color:var(--muted);display:block;font-size:12px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.badge.err{background:#fee2e2;color:var(--danger)}.badge.warn{background:#fef3c7;color:var(--warn)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.muted{color:var(--muted)}.small{font-size:13px}
.hidden{display:none!important}
.center{text-align:center;padding:40px}
.detail{grid-column:1/-1;background:var(--bg);border-radius:12px;padding:10px;font-size:13px}
.detail table{width:100%;border-collapse:collapse}.detail td{padding:4px 6px;border-bottom:1px solid var(--line)}
@media (max-width:600px){.user{grid-template-columns:40px 1fr}.acts{grid-column:1/-1;justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
 <div class="hdr"><h1>لوحة مدير خزنة</h1><span class="small muted" id="who"></span><button class="btn light sm" id="btnPass">تغيير كلمة المرور</button><button class="btn danger sm" id="btnOut">خروج</button></div>
 <div id="gate" class="center"><p>جاري التحقق…</p></div>
 <div id="panel" class="hidden">
  <div class="stats"><div class="stat"><b id="sUsers">0</b><span>مستخدم</span></div><div class="stat"><b id="sActive">0</b><span>نشط (دخل خلال 30 يومًا)</span></div><div class="stat"><b id="sUploads">0</b><span>إجمالي الملفات المرفوعة</span></div><div class="stat"><b id="sBlocked">0</b><span>موقوف / منتهي</span></div></div>
  <div class="card"><div class="row"><input id="q" placeholder="بحث بالبريد أو الاسم" style="flex:1;min-width:200px"><select id="filter"><option value="">الكل</option><option value="active">نشط</option><option value="blocked">موقوف</option><option value="expired">منتهي</option></select><button class="btn light sm" id="btnReload">تحديث</button></div></div>
  <div class="card" id="list"></div>
  <p class="muted small">الحذف هنا يحذف سجل المستخدم من قاعدة البيانات ويمنعه من الدخول؛ ملفاته في Google Drive الخاص به لا تتأثر.</p>
 </div>
</div>
<script>
const CONFIG = { firebase: { apiKey: "AIzaSyC6In0r987jy3FUizv7xqVJxwnOTL6eHS4", authDomain: "khazna-65078.firebaseapp.com", databaseURL: "https://khazna-65078-default-rtdb.europe-west1.firebasedatabase.app", projectId: "khazna-65078", storageBucket: "khazna-65078.firebasestorage.app", messagingSenderId: "854348562788", appId: "1:854348562788:web:ffac12e5216cd649d53a71" }, adminEmail: "a0545777031@gmail.com" };
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('ar-SA-u-ca-gregory-nu-latn',{dateStyle:'medium',timeStyle:'short'}) : '—';
const DEMO = !CONFIG.firebase.apiKey || typeof firebase === 'undefined';
let USERS = {}, ACT = {};
if (DEMO) {
  USERS = { u1:{email:'faisal@gmail.com',name:'فيصل',status:'active',created:Date.now()-8e8,lastLogin:Date.now()-3e6,uploads:42}, u2:{email:'sara@gmail.com',name:'سارة',status:'active',expires:'2026-08-01',created:Date.now()-5e9,lastLogin:Date.now()-9e9,uploads:7}, u3:{email:'ahmed@gmail.com',name:'',status:'blocked',created:Date.now()-2e9,lastLogin:Date.now()-2e9,uploads:0} };
  $('who').textContent='وضع تجريبي'; $('gate').classList.add('hidden'); $('panel').classList.remove('hidden'); render();
} else {
  firebase.initializeApp(CONFIG.firebase); const auth=firebase.auth(), db=firebase.database();
  auth.onAuthStateChanged(async u => {
    if (!u) { location.href='index.html'; return; }
    if ((u.email||'').toLowerCase()!==CONFIG.adminEmail.toLowerCase()) { $('gate').innerHTML='<p>هذه الصفحة لمدير النظام فقط.</p><a href="index.html">العودة</a>'; return; }
    $('who').textContent=u.email; $('gate').classList.add('hidden'); $('panel').classList.remove('hidden');
    db.ref('users').on('value', s => { USERS = s.val()||{}; render(); });
  });
  $('btnOut').onclick=()=>auth.signOut().then(()=>location.href='index.html');
  $('btnReload').onclick=()=>db.ref('users').get().then(s=>{USERS=s.val()||{};render();});
  $('btnPass').onclick=async()=>{ const a=prompt('كلمة المرور الحالية'); if(!a) return; const b=prompt('كلمة المرور الجديدة (6 أحرف على الأقل)'); if(!b||b.length<6) return; try{ const u=auth.currentUser; await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,a)); await u.updatePassword(b); alert('تم التغيير'); }catch(e){ alert('فشل: '+(e.message||e)); } };
  window.act = {
    async block(uid, v){ await db.ref('users/'+uid).update({ status: v?'blocked':'active' }); },
    async expire(uid, months){ let d = months===0 ? '' : (()=>{ const x=new Date(); x.setMonth(x.getMonth()+months); return x.toISOString().slice(0,10); })(); if (months===-1) { d = prompt('تاريخ الانتهاء (YYYY-MM-DD)', USERS[uid].expires||''); if (d===null) return; } await db.ref('users/'+uid).update({ expires: d||null }); },
    async del(uid){ if (!confirm('حذف سجل المستخدم '+USERS[uid].email+'؟')) return; await db.ref('users/'+uid).remove(); await db.ref('activity/'+uid).remove(); },
    async detail(uid){ const el=$('d_'+uid); if (!el.classList.contains('hidden')) { el.classList.add('hidden'); return; } el.classList.remove('hidden'); el.innerHTML='جاري التحميل…'; const s=await db.ref('activity/'+uid+'/logins').limitToLast(30).get(); const l=Object.values(s.val()||{}).sort((a,b)=>b.t-a.t); el.innerHTML = l.length? '<b>آخر عمليات الدخول</b><table>'+l.map(x=>`<tr><td>${fmt(x.t)}</td><td class="muted">${esc(x.ua)}</td></tr>`).join('')+'</table>' : 'لا توجد سجلات'; }
  };
}
if (DEMO) window.act = { block(uid,v){USERS[uid].status=v?'blocked':'active';render();}, expire(uid,m){ if(m===0) USERS[uid].expires=''; else { const x=new Date(); x.setMonth(x.getMonth()+(m>0?m:1)); USERS[uid].expires=x.toISOString().slice(0,10);} render(); }, del(uid){ delete USERS[uid]; render(); }, detail(uid){ const el=$('d_'+uid); el.classList.toggle('hidden'); el.innerHTML='<b>آخر عمليات الدخول</b><table><tr><td>'+fmt(Date.now()-3e6)+'</td><td class="muted">iPhone Safari</td></tr></table>'; } };
$('q').oninput=render; $('filter').onchange=render;
function state(u){ if (u.status==='blocked') return 'blocked'; if (u.expires && new Date(u.expires)<new Date()) return 'expired'; return 'active'; }
function render(){
  const q=($('q').value||'').toLowerCase(), f=$('filter').value; const now=Date.now();
  const all=Object.entries(USERS).map(([uid,u])=>({uid,...u,st:state(u)})).sort((a,b)=>(b.lastLogin||b.created||0)-(a.lastLogin||a.created||0));
  $('sUsers').textContent=all.length; $('sActive').textContent=all.filter(u=>u.lastLogin && now-u.lastLogin<30*864e5).length; $('sUploads').textContent=all.reduce((n,u)=>n+(+u.uploads||0),0); $('sBlocked').textContent=all.filter(u=>u.st!=='active').length;
  const list=all.filter(u=>(!q||(u.email||'').toLowerCase().includes(q)||(u.name||'').toLowerCase().includes(q))&&(!f||u.st===f));
  $('list').innerHTML = list.length ? list.map(u=>`<div class="user">
   <div class="av">${u.photo?`<img src="${esc(u.photo)}">`:esc((u.name||u.email||'?')[0])}</div>
   <div class="info"><b>${esc(u.name||'—')} <span class="badge ${u.st==='active'?'':u.st==='blocked'?'err':'warn'}">${u.st==='active'?'نشط':u.st==='blocked'?'موقوف':'منتهي'}</span></b><small>${esc(u.email)}</small><small>تسجيل: ${fmt(u.created)} · آخر دخول: ${fmt(u.lastLogin)} · ملفات مرفوعة: ${u.uploads||0}${u.expires?' · ينتهي: '+esc(u.expires):''}</small></div>
   <div class="acts">
    <button class="btn light sm" onclick="act.detail('${u.uid}')">السجل</button>
    <button class="btn light sm" onclick="act.expire('${u.uid}',1)">+شهر</button><button class="btn light sm" onclick="act.expire('${u.uid}',12)">+سنة</button><button class="btn light sm" onclick="act.expire('${u.uid}',-1)">تاريخ</button><button class="btn light sm" onclick="act.expire('${u.uid}',0)">بلا انتهاء</button>
    ${u.st==='blocked'?`<button class="btn sm" onclick="act.block('${u.uid}',false)">تفعيل</button>`:`<button class="btn warn sm" onclick="act.block('${u.uid}',true)">إيقاف</button>`}
    <button class="btn danger sm" onclick="act.del('${u.uid}')">حذف</button>
   </div>
   <div class="detail hidden" id="d_${u.uid}"></div>
  </div>`).join('') : '<div class="center muted">لا يوجد مستخدمون</div>';
}
</script>
</body>
</html>
